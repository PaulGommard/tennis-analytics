[protocol]
validation_years = [2018, 2019, 2020, 2021, 2022]
benchmark_start = "2023-01-01"
random_seed = 20261006
early_stopping_rounds = 75
calibration_min_year = 2019
shap_sample_size = 2000
interaction_sample_size = 300
permutation_repeats = 3

# A compact, hypothesis-driven search. Every configuration is evaluated on all
# five temporal folds and both feature variants.
[[xgboost]]
id = "xgb_d2_smooth"
max_depth = 2
learning_rate = 0.03
n_estimators = 1200
min_child_weight = 10.0
subsample = 0.85
colsample_bytree = 0.85
reg_alpha = 0.0
reg_lambda = 5.0

[[xgboost]]
id = "xgb_d3_balanced"
max_depth = 3
learning_rate = 0.03
n_estimators = 1200
min_child_weight = 10.0
subsample = 0.85
colsample_bytree = 0.85
reg_alpha = 0.1
reg_lambda = 5.0

